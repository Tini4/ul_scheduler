name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint extension
        run: npm run lint:ext

      - name: Create zip
        run: |
          cd dist
          zip -r ../ul_scheduler.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ul_scheduler.zip
